name: TX recovery binaries

on:
  push:
    branches:
      - perf/tx-dgram-pool-recovery

env:
  CARGO_TERM_COLOR: always
  CROSS_CONFIG: Cross.toml

jobs:
  build:
    name: Build / ${{ matrix.cpu }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: znver1
            artifact: usque-rs-txpool-znver1
          - cpu: znver2
            artifact: usque-rs-txpool-znver2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: tx-recovery-${{ matrix.cpu }}

      - name: Install cross
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cross

      - name: Build
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
        run: cross build --release --target x86_64-unknown-linux-musl

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/usque-rs "dist/${{ matrix.artifact }}"
          sha256sum "dist/${{ matrix.artifact }}" > "dist/${{ matrix.artifact }}.sha256"

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
