name: Maintenance issue queue

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dependency-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Prepare labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "automation:dependency" --repo "$REPO" --color "1d76db" --description "Cargo.toml dependency upgrade queued automatically" --force
          gh label create "automation:lockfile" --repo "$REPO" --color "0e8a16" --description "Cargo.lock refresh queued automatically" --force
          gh label create "automation:maintenance-error" --repo "$REPO" --color "d73a4a" --description "The passive maintenance detector itself needs repair" --force

      - name: Install current stable Rust and cargo-upgrade
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install cargo-edit --version 0.13.13 --locked --no-default-features --features upgrade

      - name: Detect manifest dependency upgrades
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          if ! cargo upgrade --incompatible allow --pinned allow > /tmp/cargo-upgrade.log 2>&1 ||
             ! cargo update >> /tmp/cargo-upgrade.log 2>&1; then
            cat /tmp/cargo-upgrade.log
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t quarantined < <(python3 .github/scripts/cargo-release-quarantine.py manifest --hours 72)
          if (( ${#quarantined[@]} )); then
            printf 'Quarantining fresh direct dependencies: %s\\n' "${quarantined[*]}"
            git reset --hard HEAD
            exclude_args=()
            for dep in "${quarantined[@]}"; do
              exclude_args+=(--exclude "$dep")
            done
            if ! cargo upgrade --incompatible allow --pinned allow "${exclude_args[@]}" >> /tmp/cargo-upgrade.log 2>&1 ||
               ! cargo update >> /tmp/cargo-upgrade.log 2>&1; then
              cat /tmp/cargo-upgrade.log
              echo "failed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! python3 .github/scripts/cargo-release-quarantine.py lockfile --hours 72; then
            echo "quarantined=true" >> "$GITHUB_OUTPUT"
            git reset --hard HEAD
            exit 0
          fi

          python3 <<'PY'
          import json
          import subprocess
          import tomllib
          from pathlib import Path

          DEP_TABLES = {"dependencies", "dev-dependencies", "build-dependencies"}

          def load_before(path: str):
              raw = subprocess.check_output(["git", "show", f"HEAD:{path}"])
              return tomllib.loads(raw.decode())

          def load_after(path: str):
              with open(path, "rb") as f:
                  return tomllib.load(f)

          def declaration(value):
              if isinstance(value, str):
                  return value
              if isinstance(value, dict):
                  return json.dumps(value, sort_keys=True, separators=(",", ":"))
              return json.dumps(value, sort_keys=True)

          def collect(obj, prefix=()):
              out = {}
              if not isinstance(obj, dict):
                  return out
              for key, value in obj.items():
                  if key in DEP_TABLES and isinstance(value, dict):
                      table = ".".join((*prefix, key))
                      for dep, spec in value.items():
                          out[(table, dep)] = declaration(spec)
                  if isinstance(value, dict):
                      out.update(collect(value, (*prefix, key)))
              return out

          files = subprocess.check_output(
              ["git", "ls-files", "*Cargo.toml"], text=True
          ).splitlines()

          grouped = {}
          for path in files:
              if not Path(path).exists():
                  continue
              before = collect(load_before(path))
              after = collect(load_after(path))
              for key in sorted(set(before) | set(after)):
                  old = before.get(key)
                  new = after.get(key)
                  if old == new:
                      continue
                  table, dep = key
                  grouped.setdefault(dep, []).append({
                      "manifest": path,
                      "table": table,
                      "old": old,
                      "new": new,
                  })

          payload = [
              {"dependency": dep, "changes": changes}
              for dep, changes in sorted(grouped.items())
          ]
          Path("/tmp/manifest-upgrades.json").write_text(json.dumps(payload, indent=2))
          print(json.dumps(payload, indent=2))
          PY

          git reset --hard HEAD

      - name: Clear stale dependency queues while candidate is quarantined
        if: steps.manifest.outputs.quarantined == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for label in automation:dependency automation:lockfile; do
            gh issue list --repo "$REPO" --state open --label "$label" --limit 200 --json number --jq '.[].number' |
            while read -r number; do
              [[ -n "$number" ]] && gh issue close "$number" --repo "$REPO" --reason completed --comment "Closed automatically: the currently resolved dependency candidate is inside the 72-hour quarantine, so this previously actionable candidate is stale."
            done
          done

      - name: Queue manifest dependency issues
        if: steps.manifest.outputs.failed != 'true' && steps.manifest.outputs.quarantined != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r item; do
            dep="$(jq -r '.dependency' <<<"$item")"
            marker="automation-dependency-${dep}"
            existing="$(gh issue list --repo "$REPO" --state open --label "automation:dependency" --limit 200 --search "${marker} in:body" --json number --jq '.[0].number // empty')"

            details="$(jq -r '.changes[] | "- `\(.manifest)` / `\(.table)`: `\(.old)` → `\(.new)`"' <<<"$item")"
            export marker dep details log stat update_log VERSION
            body="$(python3 .github/scripts/render-maintenance-template.py <<'EOF'
          <!-- ${marker} -->
          <!-- automation-queue:dependency -->

          `cargo upgrade` reports a newer manifest dependency requirement for **${dep}**.

          ${details}

          Update this dependency everywhere appropriate, including incompatible/major changes. Read the crate's changelog/release notes where useful, adapt code to current APIs and best practices, refresh `Cargo.lock`, and run the full relevant CI/test suite. Do not skip an update merely because it is transitive, low-risk, or already SemVer-compatible.

          This issue is generated and refreshed automatically. A ChatGPT maintenance automation is expected to implement it.
          EOF
          )"

            if [[ -n "$existing" ]]; then
              gh issue edit "$existing" --repo "$REPO" --title "deps: upgrade ${dep}" --body "$body"
            else
              gh issue create --repo "$REPO" --title "deps: upgrade ${dep}" --label "automation:dependency" --body "$body"
            fi
          done < <(jq -c '.[]' /tmp/manifest-upgrades.json)

          # Close stale generated dependency issues when cargo-upgrade no longer
          # reports that dependency. A future upgrade will open a fresh issue.
          gh issue list --repo "$REPO" --state open --label "automation:dependency" --limit 200 --json number,body --jq '.[] | @base64' |
          while IFS= read -r encoded; do
            issue="$(base64 -d <<<"$encoded")"
            number="$(jq -r '.number' <<<"$issue")"
            body="$(jq -r '.body' <<<"$issue")"
            dep="$(sed -n 's/.*<!-- automation-dependency-\([^ ]*\) -->.*/\1/p' <<<"$body" | head -n1)"
            [[ -n "$dep" ]] || continue
            if ! jq -e --arg dep "$dep" 'any(.[]; .dependency == $dep)' /tmp/manifest-upgrades.json >/dev/null; then
              gh issue close "$number" --repo "$REPO" --reason completed --comment "Closed automatically: cargo-upgrade no longer reports this manifest dependency as needing an upgrade."
            fi
          done

      - name: Report cargo-upgrade detector failure
        if: steps.manifest.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          marker="automation-maintenance-error-cargo-upgrade"
          existing="$(gh issue list --repo "$REPO" --state open --label "automation:maintenance-error" --limit 50 --search "${marker} in:body" --json number --jq '.[0].number // empty')"
          log="$(tail -n 200 /tmp/cargo-upgrade.log)"
          export marker dep details log stat update_log VERSION
          body="$(python3 .github/scripts/render-maintenance-template.py <<'EOF'
          <!-- ${marker} -->
          The passive dependency detector failed while running `cargo upgrade`.

          ```text
          ${log}
          ```

          Repair the detector or repository state so passive dependency issue creation resumes.
          EOF
          )"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "maintenance detector: cargo-upgrade failed" --label "automation:maintenance-error" --body "$body"
          fi

      - name: Detect lockfile-only updates
        id: lockfile
        if: steps.manifest.outputs.failed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          if ! cargo update > /tmp/cargo-update.log 2>&1; then
            cat /tmp/cargo-update.log
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! python3 .github/scripts/cargo-release-quarantine.py lockfile --hours 72; then
            echo "quarantined=true" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git reset --hard HEAD
            exit 0
          fi
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- Cargo.lock > /tmp/lockfile-stat.txt
          fi
          git reset --hard HEAD

      - name: Clear stale lockfile queue while candidate is quarantined
        if: steps.lockfile.outputs.quarantined == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue list --repo "$REPO" --state open --label "automation:lockfile" --limit 100 --json number --jq '.[].number' |
          while read -r number; do
            [[ -n "$number" ]] && gh issue close "$number" --repo "$REPO" --reason completed --comment "Closed automatically: the newly resolved lockfile candidate is inside the 72-hour quarantine, so this previously actionable candidate is stale."
          done

      - name: Queue or close lockfile refresh issue
        if: steps.manifest.outputs.failed != 'true' && steps.lockfile.outputs.failed != 'true' && steps.lockfile.outputs.quarantined != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHANGED: ${{ steps.lockfile.outputs.changed }}
        shell: bash
        run: |
          set -euo pipefail
          marker="automation-lockfile-refresh"
          existing="$(gh issue list --repo "$REPO" --state open --label "automation:lockfile" --limit 50 --search "${marker} in:body" --json number --jq '.[0].number // empty')"

          if [[ "$CHANGED" == "true" ]]; then
            update_log="$(tail -n 250 /tmp/cargo-update.log)"
            stat="$(cat /tmp/lockfile-stat.txt)"
            export marker dep details log stat update_log VERSION
            body="$(python3 .github/scripts/render-maintenance-template.py <<'EOF'
          <!-- ${marker} -->
          <!-- automation-queue:lockfile -->

          A plain `cargo update` changes `Cargo.lock`, so there are compatible and/or transitive dependency updates available even if no manifest requirement needs changing.

          ```text
          ${stat}

          ${update_log}
          ```

          Refresh the entire lockfile, inspect noteworthy transitive changes where appropriate, run the full relevant CI/test suite, and fix any fallout. There is intentionally no "too trivial to bother" threshold.

          This issue is generated and refreshed automatically. A ChatGPT maintenance automation is expected to implement it.
          EOF
          )"
            if [[ -n "$existing" ]]; then
              gh issue edit "$existing" --repo "$REPO" --body "$body"
            else
              gh issue create --repo "$REPO" --title "deps: refresh Cargo.lock" --label "automation:lockfile" --body "$body"
            fi
          elif [[ -n "$existing" ]]; then
            gh issue close "$existing" --repo "$REPO" --reason completed --comment 'Closed automatically: `cargo update` no longer changes Cargo.lock.'
          fi

      - name: Report cargo-update detector failure
        if: steps.lockfile.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          marker="automation-maintenance-error-cargo-update"
          existing="$(gh issue list --repo "$REPO" --state open --label "automation:maintenance-error" --limit 50 --search "${marker} in:body" --json number --jq '.[0].number // empty')"
          log="$(tail -n 200 /tmp/cargo-update.log)"
          export marker dep details log stat update_log VERSION
          body="$(python3 .github/scripts/render-maintenance-template.py <<'EOF'
          <!-- ${marker} -->
          The passive dependency detector failed while running `cargo update`.

          ```text
          ${log}
          ```

          Repair the detector or repository state so passive lockfile issue creation resumes.
          EOF
          )"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "maintenance detector: cargo-update failed" --label "automation:maintenance-error" --body "$body"
          fi

  rust-release-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Detect current stable Rust and queue a full review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://static.rust-lang.org/dist/channel-rust-stable.toml -o /tmp/rust-stable.toml
          read -r VERSION RELEASE_DATE ELIGIBLE < <(python3 - <<'PY'
          import datetime as dt
          import tomllib
          with open("/tmp/rust-stable.toml", "rb") as f:
              data = tomllib.load(f)
          version = data["pkg"]["rust"]["version"].split()[0]
          release_date = dt.date.fromisoformat(data["date"])
          # The manifest has date precision only. Waiting until UTC midnight
          # four dates later guarantees at least 72 hours even if publication
          # happened at the very end of the release date.
          eligible_at = dt.datetime.combine(
              release_date + dt.timedelta(days=4),
              dt.time.min,
              tzinfo=dt.timezone.utc,
          )
          eligible = dt.datetime.now(dt.timezone.utc) >= eligible_at
          print(version, release_date.isoformat(), "yes" if eligible else "no")
          PY
          )

          test -n "$VERSION"
          echo "Current stable Rust: $VERSION (release date $RELEASE_DATE)"
          if [[ "$ELIGIBLE" != "yes" ]]; then
            echo "Rust $VERSION is still inside the 72-hour release quarantine"
            exit 0
          fi

          gh label create "automation:rust-release" --repo "$REPO" --color "8250df" --description "Queued automatically when stable Rust changes" --force

          marker="rust-stable-${VERSION}"
          existing="$(gh issue list --repo "$REPO" --state all --limit 200 --search "${marker} in:body" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "Rust $VERSION review already exists as issue #$existing"
            exit 0
          fi

          export marker dep details log stat update_log VERSION

          body="$(python3 .github/scripts/render-maintenance-template.py <<'EOF'
          <!-- ${marker} -->
          <!-- automation-queue:rust-release -->

          Rust **${VERSION}** is now the stable toolchain.

          Do a complete repository refresh against this release rather than only replacing the toolchain version:

          - Read the official Rust ${VERSION} announcement and detailed release notes/changelog.
          - Review relevant language, standard-library, rustc, Cargo, Clippy, rustfmt, target/platform, and tooling changes.
          - Review all Rust code, `Cargo.toml`/`Cargo.lock`, CI, Docker/build tooling, `SKILL.md`, README/docs, examples, lints, and project conventions for newly preferable patterns or obsolete workarounds.
          - Adopt useful newly-stable features and current best practices where they improve the project; remove workarounds that the new stable release makes unnecessary.
          - Update the current-stable CI/toolchain references while preserving the intentional MSRV contract unless there is a separately justified reason to raise it.
          - Run the full CI-equivalent test matrix and fix fallout.
          - If the release genuinely requires no changes beyond what is already present, document what was reviewed and close this issue as a no-op.

          This issue is generated automatically. A ChatGPT maintenance automation is expected to implement it.
          EOF
          )"

          gh issue create --repo "$REPO" --title "Rust ${VERSION}: full best-practices refresh" --label "automation:rust-release" --body "$body"

  upstream-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "automation:upstream" --repo "$REPO" --color "0e8a16" --description "Upstream fork changes queued automatically" --force
          gh label create "automation:quarantine" --repo "$REPO" --color "6e7781" --description "Candidate observed but not yet old enough to act on" --force

      - name: Detect and mechanically quarantine upstream drift
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags https://github.com/xytoki/usque-lib.git usque-lib:refs/remotes/maintenance-parent/usque-lib
          git fetch --no-tags https://github.com/Diniboy1123/usque-rs.git main:refs/remotes/maintenance-source/main

          parent_commits="$(git cherry HEAD refs/remotes/maintenance-parent/usque-lib | awk '$1 == "+" { print $2 }')"
          source_commits="$(git cherry HEAD refs/remotes/maintenance-source/main | awk '$1 == "+" { print $2 }')"

          marker="maintenance-kind-upstream"

          if [[ -z "$parent_commits" && -z "$source_commits" ]]; then
            gh issue list --repo "$REPO" --state open --limit 100 --search "$marker in:body" --json number --jq '.[].number' |
            while read -r number; do
              [[ -n "$number" ]] && gh issue close "$number" --repo "$REPO" --reason completed --comment "Closed automatically: no upstream patch-equivalent changes remain."
            done
            echo "No upstream drift."
            exit 0
          fi

          fingerprint="$(printf 'parent\n%s\nsource\n%s\n' "$parent_commits" "$source_commits" | sha256sum | awk '{print $1}')"
          fpmarker="maintenance-fingerprint-$fingerprint"

          {
            echo "Upstream patch-equivalent changes not present in this fork:"
            if [[ -n "$parent_commits" ]]; then
              echo
              echo "Parent: xytoki/usque-lib branch usque-lib"
              while read -r sha; do
                [[ -n "$sha" ]] && git show -s --format='- %h %s' "$sha"
              done <<<"$parent_commits"
            fi
            if [[ -n "$source_commits" ]]; then
              echo
              echo "Source: Diniboy1123/usque-rs branch main"
              while read -r sha; do
                [[ -n "$sha" ]] && git show -s --format='- %h %s' "$sha"
              done <<<"$source_commits"
            fi
          } >/tmp/upstream-details.txt

          completed="$(gh issue list --repo "$REPO" --state closed --label "automation:upstream" --limit 200 --search "$marker $fpmarker in:body" --json number --jq '.[0].number // empty')"
          if [[ -n "$completed" ]]; then
            echo "This exact upstream candidate was already processed as issue #$completed."
            exit 0
          fi

          state="$(gh issue list --repo "$REPO" --state open --label "automation:quarantine" --limit 100 --search "$marker $fpmarker in:body" --json number,createdAt --jq '.[0] // empty')"

          if [[ -z "$state" ]]; then
            gh issue list --repo "$REPO" --state open --limit 100 --search "$marker in:body" --json number --jq '.[].number' |
            while read -r number; do
              [[ -n "$number" ]] && gh issue close "$number" --repo "$REPO" --reason completed --comment "Candidate changed before the 72-hour quarantine expired."
            done

            {
              echo "<!-- $marker -->"
              echo "<!-- $fpmarker -->"
              echo
              echo "This exact upstream candidate is in the 72-hour mechanical quarantine."
              echo "A changed upstream patch set restarts the timer."
              echo
              cat /tmp/upstream-details.txt
              echo
              echo "This is detector state, not maintenance work."
            } >/tmp/upstream-quarantine.md

            gh issue create --repo "$REPO" --title "quarantine: upstream" --label "automation:quarantine" --body-file /tmp/upstream-quarantine.md
            echo "First sighting; upstream candidate quarantined."
            exit 0
          fi

          created="$(jq -r '.createdAt' <<<"$state")"
          eligible="$(python3 - "$created" <<'PY'
          import datetime as dt, sys
          created=dt.datetime.fromisoformat(sys.argv[1].replace("Z","+00:00"))
          print("yes" if dt.datetime.now(dt.timezone.utc)-created >= dt.timedelta(hours=72) else "no")
          PY
          )"

          if [[ "$eligible" != "yes" ]]; then
            echo "Upstream candidate is still inside the 72-hour quarantine."
            exit 0
          fi

          {
            echo "<!-- $marker -->"
            echo "<!-- $fpmarker -->"
            echo "<!-- automation-queue:upstream -->"
            echo
            echo "This exact upstream patch set remained unchanged for at least 72 hours:"
            echo
            cat /tmp/upstream-details.txt
            echo
            echo "Review and port relevant changes; skip changes that conflict with intentional fork behavior and explain omissions."
            echo "Preserve the fork's 1 KiB buffers and x86-64-v2/v3 release targets unless an upstream change specifically justifies altering them."
            echo "Do not include newer upstream commits that have not passed their own detector quarantine."
          } >/tmp/upstream-actionable.md

          actionable="$(gh issue list --repo "$REPO" --state open --label "automation:upstream" --limit 100 --search "$marker in:body" --json number --jq '.[0].number // empty')"
          if [[ -n "$actionable" ]]; then
            gh issue edit "$actionable" --repo "$REPO" --title "upstream: review new usque-rs changes" --body-file /tmp/upstream-actionable.md
          else
            gh issue create --repo "$REPO" --title "upstream: review new usque-rs changes" --label "automation:upstream" --body-file /tmp/upstream-actionable.md
          fi

  tooling-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Prepare labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "automation:tooling" --repo "$REPO" --color "fbca04" --description "Pinned CI/release tooling update queued automatically" --force
          gh label create "automation:quarantine" --repo "$REPO" --color "6e7781" --description "Candidate observed but not yet old enough to act on" --force

      - name: Detect and mechanically quarantine tooling drift
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          : >/tmp/tooling-candidate.txt
          for spec in \
            actions/checkout \
            Swatinem/rust-cache \
            taiki-e/install-action \
            softprops/action-gh-release
          do
            latest="$(gh api "repos/$spec/releases/latest" --jq .tag_name)"
            found="$(grep -Rho --include='*.yml' "$spec@[^[:space:]]*" .github/workflows | sed "s#$spec@##" | sort -u | paste -sd, -)"
            if [[ -n "$found" && "$found" != "$latest" ]]; then
              printf '%s\t%s\t%s\n' "$spec" "$found" "$latest" >>/tmp/tooling-candidate.txt
            fi
          done

          marker="maintenance-kind-tooling"

          if [[ ! -s /tmp/tooling-candidate.txt ]]; then
            gh issue list --repo "$REPO" --state open --limit 100 --search "$marker in:body" --json number --jq '.[].number' |
            while read -r number; do
              [[ -n "$number" ]] && gh issue close "$number" --repo "$REPO" --reason completed --comment "Closed automatically: tracked action pins are current."
            done
            echo "No tooling drift."
            exit 0
          fi

          fingerprint="$(sha256sum /tmp/tooling-candidate.txt | awk '{print $1}')"
          fpmarker="maintenance-fingerprint-$fingerprint"

          {
            echo "Pinned GitHub Actions differ from their current stable releases:"
            while IFS=$'\t' read -r spec current latest; do
              printf -- '- %s: %s -> %s\n' "$spec" "$current" "$latest"
            done </tmp/tooling-candidate.txt
          } >/tmp/tooling-details.txt

          completed="$(gh issue list --repo "$REPO" --state closed --label "automation:tooling" --limit 200 --search "$marker $fpmarker in:body" --json number --jq '.[0].number // empty')"
          if [[ -n "$completed" ]]; then
            echo "This exact tooling candidate was already processed as issue #$completed."
            exit 0
          fi

          state="$(gh issue list --repo "$REPO" --state open --label "automation:quarantine" --limit 100 --search "$marker $fpmarker in:body" --json number,createdAt --jq '.[0] // empty')"

          if [[ -z "$state" ]]; then
            gh issue list --repo "$REPO" --state open --limit 100 --search "$marker in:body" --json number --jq '.[].number' |
            while read -r number; do
              [[ -n "$number" ]] && gh issue close "$number" --repo "$REPO" --reason completed --comment "Candidate changed before the 72-hour quarantine expired."
            done

            {
              echo "<!-- $marker -->"
              echo "<!-- $fpmarker -->"
              echo
              echo "This exact tooling candidate is in the 72-hour mechanical quarantine."
              echo "A changed candidate restarts the timer."
              echo
              cat /tmp/tooling-details.txt
              echo
              echo "This is detector state, not maintenance work."
            } >/tmp/tooling-quarantine.md

            gh issue create --repo "$REPO" --title "quarantine: tooling" --label "automation:quarantine" --body-file /tmp/tooling-quarantine.md
            echo "First sighting; tooling candidate quarantined."
            exit 0
          fi

          created="$(jq -r '.createdAt' <<<"$state")"
          eligible="$(python3 - "$created" <<'PY'
          import datetime as dt, sys
          created=dt.datetime.fromisoformat(sys.argv[1].replace("Z","+00:00"))
          print("yes" if dt.datetime.now(dt.timezone.utc)-created >= dt.timedelta(hours=72) else "no")
          PY
          )"

          if [[ "$eligible" != "yes" ]]; then
            echo "Tooling candidate is still inside the 72-hour quarantine."
            exit 0
          fi

          {
            echo "<!-- $marker -->"
            echo "<!-- $fpmarker -->"
            echo "<!-- automation-queue:tooling -->"
            echo
            echo "The following exact action-pin set remained unchanged for at least 72 hours:"
            echo
            cat /tmp/tooling-details.txt
            echo
            echo "Update exactly these refs together, review major-version migration notes, and run the full CI/release validation."
            echo "Do not substitute a newer action release than the versions listed here."
          } >/tmp/tooling-actionable.md

          actionable="$(gh issue list --repo "$REPO" --state open --label "automation:tooling" --limit 100 --search "$marker in:body" --json number --jq '.[0].number // empty')"
          if [[ -n "$actionable" ]]; then
            gh issue edit "$actionable" --repo "$REPO" --title "maintenance: update pinned GitHub Actions" --body-file /tmp/tooling-actionable.md
          else
            gh issue create --repo "$REPO" --title "maintenance: update pinned GitHub Actions" --label "automation:tooling" --body-file /tmp/tooling-actionable.md
          fi
